<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Markdown Parser</title>
    <link rel="stylesheet" href="/css/style2.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
</head>
<body>
    <header>
        <h1>Markdown Parser</h1>
        <p>Dynamic markdown parsing using <code>marked.js</code>.</p>
    </header>

    <!-- Container where your parsed HTML will live -->
    <div id="content">Loading content...</div>

    <script>
        async function loadMarkdown() {
            try {
                // 1. Fetch your external markdown file
                const response = await fetch('/mdfiles/content.md');
                
                if (!response.ok) {
                    throw new Error('Failed to load markdown file');
                }
                
                // 2. Get the raw text content
                const markdownText = await response.text();
                
                // 3. Convert Markdown text into HTML string using Marked.js
                const htmlContent = marked.parse(markdownText);
                
                // 4. Inject the HTML into your page container
                document.getElementById('content').innerHTML = htmlContent;
            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }

        // Run the script after the page loads
        window.onload = loadMarkdown;
    </script>
</body>
</html>
