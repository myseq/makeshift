<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Optional: Load local or self-hosted Cascadia Code */
    @font-face {
      font-family: 'Cascadia Code';
      src: local('Cascadia Code Italic'),
           url('CascadiaCodeItalic.woff2') format('woff2');
      font-style: italic;
      font-weight: 400;
    }

    code {
      font-family: 'Cascadia Code', monospace;
      font-size: 1.2rem;
    }

    .cursive {
      font-style: italic;
      font-feature-settings: "calt" 1, "ss01" 1;
    }
  </style>
</head>
<body>
  <p><code>const regular = (x) => x * 2;</code></p>
  <p><code class="cursive">const cursive = (x) => x * 2;</code></p>
</body>
</html>
