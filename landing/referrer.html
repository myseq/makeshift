<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Referrer</title>
</head>

<body>

    <h2>HTTP Referrer</h2>

    <p id="status">Checking referrer...</p>

    <p>
        <strong>Referrer:</strong>
        <a id="referrer" target="_blank" rel="noopener noreferrer"></a>
    </p>

    <script>
        const referrer = document.referrer;
        const link = document.getElementById("referrer");
        const status = document.getElementById("status");

        if (referrer) {
            link.textContent = referrer;
            link.href = referrer;
            status.textContent = "Referrer detected.";
        } else {
            link.textContent = "None";
            link.removeAttribute("href");
            status.textContent = "No referrer information was provided.";
        }
    </script>

</body>
</html>
